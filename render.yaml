services:
  - type: web
    name: smart-attendance-system
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install --prefix frontend && npm run build --prefix frontend"
    startCommand: "gunicorn --timeout 0 --workers 1 --threads 4 --bind 0.0.0.0:$PORT server:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
